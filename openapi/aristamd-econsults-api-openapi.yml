openapi: 3.2.0
info:
  title: Arista MD E Consults API
  description: This is the business logic core that serves all Arista MD sites, tools, and integrations
  version: 1.0.0
tags:
- name: EConsults
paths:
  /econsults:
    get:
      tags:
      - EConsults
      summary: Retrieves a list of econsults
      description: "Retrieves a list of econsults based on its offset. Allows to order the records and\
        \ perform a\n     *     search"
      operationId: index
      parameters:
      - name: status
        in: query
        description: Filter by status(es)
        required: false
        schema:
          type: string
          enum:
          - new
          - saved_by_requester
          - econsult_recalled
          - submitted
          - opened
          - saved_by_specialist
          - dispositioned
          - ok_to_treat
          - face_to_face
          - wrong_specialty
          - pending_requester_feedback
          - pending_specialist_feedback
          - acknowledged_and_completed
          - rerouted
          - requester_feedback_sent
          - specialist_feedback_sent
          - econsult_reassigned
          - delegated
      - name: site
        in: query
        description: Filter econsults by site using the site ID
        required: false
        schema:
          type: integer
      - name: request_date[from]
        in: query
        description: Filter econsults by its request date starting from the received date. (yyyy-mm-dd)
        required: false
        schema:
          type: string
      - name: request_date[to]
        in: query
        description: Filter econsults by its request date to the received date. (yyyy-mm-dd)
        required: false
        schema:
          type: string
      - name: panelistId
        in: query
        description: Filter econsults by panelist using the panelist ID
        required: false
        schema:
          type: integer
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EConsult'
        '400':
          description: Invalid Credentials
          content:
            application/json:
              schema: {}
        '403':
          description: Unauthorized
          content:
            application/json:
              schema: {}
    post:
      tags:
      - EConsults
      summary: Creates an EConsult
      description: "Save an econsult object with the input specified. The STORE method should ONLY deal\
        \ with the\n     *                 eConsult object. It should not touch the User/Patient/ etc.\
        \ Those items that need to be helped\n     *                 onto the model should be a seperate\
        \ class that is responsible for helping 'build' the perfect\n     *                 econsult model\
        \ Default state is saved by requester."
      operationId: store
      responses:
        '201':
          description: Created EConsult
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EConsult'
        '400':
          description: Invalid credentials
        '500':
          description: Internal Error
        '404':
          description: Not Found
        '403':
          description: Unauthorized
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EConsult'
        description: EConsult body
        required: true
  /econsults/{econsultId}:
    get:
      tags:
      - EConsults
      summary: Retrieves an EConsult
      description: Finds EConsult by ID
      operationId: show
      parameters:
      - name: econsultId
        in: path
        description: ID of econsult to return
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Econsult Record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EConsult'
        '400':
          description: Invalid Credentials
        '404':
          description: EConsult not found
        '403':
          description: Unauthorized
    put:
      tags:
      - EConsults
      summary: Updates an econsult
      description: Updates an econsult using its id
      operationId: update
      parameters:
      - name: econsultId
        in: path
        description: ID of econsult to update
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Updated Econsult
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EConsult'
        '400':
          description: Invalid credentials
        '500':
          description: Internal Error
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EConsult'
        description: EConsult body
        required: true
    delete:
      tags:
      - EConsults
      summary: Deletes an econsult
      description: Destroys an EConsult using its id
      operationId: destroy
      parameters:
      - name: econsultId
        in: path
        description: ID of econsult to be deleted
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Deleted EConsult
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EConsult'
        '400':
          description: Invalid credentials
        '404':
          description: Not found
    patch:
      tags:
      - EConsults
      summary: Updates an econsult
      description: Updates one or more fields of a econsult resource
      operationId: patch
      parameters:
      - name: econsultId
        in: path
        description: ID of econsult to update
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Updated Econsult
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EConsult'
        '400':
          description: Invalid credentials
        '500':
          description: Internal Error
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EConsult'
        description: EConsult body
        required: true
  /econsults/{econsultId}/assign-to-me:
    patch:
      tags:
      - EConsults
      summary: Assign econsult to current user
      description: Updates econsult panelist id to current user id
      operationId: patch
      parameters:
      - name: econsultId
        in: path
        description: ID of econsult to update
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Updated Econsult
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EConsult'
        '400':
          description: Invalid credentials
        '500':
          description: Internal Error
  /econsults/search:
    get:
      tags:
      - EConsults
      summary: Find EConsult ids by status
      description: Returns a list of eConsult Ids for the specified requesterId
      operationId: searchByStatus
      parameters:
      - name: status
        in: query
        description: Filter status
        required: false
        schema:
          type: string
          enum:
          - ok_to_treat
          - wrong_specialty
          - face_to_face
          - pending_requester_feedback
      responses:
        '200':
          description: Econsult Record
          content:
            application/json:
              schema:
                properties:
                  total_hits:
                    type: integer
                  hits:
                    type: array
                    items:
                      properties:
                        id:
                          type: integer
                        rounds:
                          type: integer
                        masked_id:
                          type: string
                        diagnosis:
                          type: string
                        main_question:
                          type: string
                        service_type:
                          type: string
                        supporting_details:
                          type: string
                        first_request_date:
                          properties:
                            date:
                              type: string
                            timezone_type:
                              type: integer
                            timezone:
                              type: string
                          type: object
                        last_edit_by_id:
                          type: integer
                        last_status_before_reassign:
                          type: string
                        last_panelist_user_id_before_reassign:
                          type: integer
                        created_by_des_agent:
                          type: boolean
                        info_required:
                          type: string
                        appropriateness:
                          type: string
                        disposition_date:
                          properties:
                            date:
                              type: string
                            timezone_type:
                              type: integer
                            timezone:
                              type: string
                          type: object
                        answer_specialty:
                          type: string
                        initials:
                          type: string
                        recommendation_support:
                          type: string
                        recommended_specialty:
                          type: string
                        face_recommendation_support:
                          type: string
                        saved:
                          type: boolean
                        additional_diagnostics:
                          type: string
                        actions_pcp:
                          type: string
                        actions_patient:
                          type: string
                        follow_up:
                          type: string
                      type: object
                type: object
        '400':
          description: Invalid Credentials
        '404':
          description: EConsult not found
        '403':
          description: Unauthorized
  /econsults/logAvailability:
    post:
      tags:
      - EConsults
      summary: Log panelist availability
      description: Create a log for panelist available times
      operationId: LogPanelistAvailability
      responses:
        '201':
          description: Event Transition was success
          content:
            application/json:
              schema: {}
      requestBody:
        content:
          application/json:
            schema:
              properties:
                econsultId:
                  type: integer
                panelistUserId:
                  type: integer
                availability:
                  type: string
                hours:
                  type: integer
                  format: float
                specialty:
                  type: string
                submitted:
                  type: boolean
                date:
                  type: string
                  format: date-time
              type: object
        description: EConsult body
        required: true
  /econsults/{eConsultId}/events:
    post:
      tags:
      - EConsults
      summary: EConsult Event Handler
      description: Handles the event for an EConsult
      operationId: events
      parameters:
      - name: eConsultId
        in: path
        description: ID of EConsult that will be transitioned
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '204':
          description: Event Transition was success
        '500':
          description: Internal Error
        '404':
          description: Not Found
      requestBody:
        content:
          application/json:
            schema:
              properties:
                action:
                  type: string
              type: object
        description: EConsult body
        required: true
  /econsults/{eConsultId}/heartbeat:
    post:
      tags:
      - EConsults
      summary: EConsult Event Handler
      description: Handles the event for an EConsult
      operationId: events
      parameters:
      - name: eConsultId
        in: path
        description: ID of EConsult that will be updated
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '204':
          description: CTP Time has been successfully updated
        '500':
          description: Internal Error
        '404':
          description: Not Found
      requestBody:
        content:
          application/json:
            schema:
              properties:
                specialistId:
                  type: number
              type: object
        description: EConsult body
        required: true
