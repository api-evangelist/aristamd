aid: aristamd
name: AristaMD
description: 'AristaMD is a San Diego based specialty care company whose eConsult
  platform connects primary care providers to a panel of board-certified specialists
  across more than 70 specialties and subspecialties, delivering asynchronous, documented
  specialist recommendations that reduce unnecessary face-to-face referrals, emergency
  department visits and hospitalizations. The platform is sold to health plans, Medicaid
  programs, federally qualified health centers and provider groups, and is delivered
  through EHR-embedded referral workflows, HL7 messaging and a REST API. AristaMD
  publishes a live Swagger 2.0 definition for its core business-logic API at
  api.aristamd.com/api-docs covering eConsults, patients, panelists, specialties,
  reviews and workup checklists, and operates an OAuth 2.0 authorization server plus
  a SAML 2.0 service-provider endpoint for federated single sign-on.'
