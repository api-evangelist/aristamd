apis:
- aid: aristamd:api
  name: AristaMD API
  description: 'The AristaMD API is the business logic core that serves all AristaMD
    sites, tools and integrations. It exposes eConsult lifecycle operations (create,
    retrieve, update, assign, search by status, event transitions and panelist
    availability), patient records including creation from HL7 messages, patient
    history and external identifiers, panelist discovery and next-available routing,
    specialties, reviews, comments, diagnostics and workup checklists. Access is
    authenticated; every documented path returns 401 without credentials.'
