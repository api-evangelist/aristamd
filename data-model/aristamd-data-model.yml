observations:
- >-
  EConsult carries both the foreign keys (panelist_id, patient_id, …) and the
  expanded objects (panelist, patient, …) in one schema, with no documented way
  to control expansion — an agent cannot tell from the contract whether a given
  response will be shallow or deep.
- >-
  `panelist_id` is typed against PanelistDetail in the expanded form but against
  User in EconsultAssignmentMetric and PanelistAvailability. The referent of that
  field is ambiguous in the published schema.
- >-
  No FHIR resources appear anywhere in the model. AristaMD's public material and
  third-party writeups describe FHIR alignment, but the published contract is a
  proprietary relational model with an HL7 v2 message intake at POST /HL7/messages.
  Recorded as a discrepancy, not resolved.
