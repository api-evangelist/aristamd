- id: oauth2
  conforms: true
  evidence: >-
    Live OAuth 2.0 authorization server at https://api.aristamd.com/oauth/token
    and /oauth/authorize. Returns RFC 6749 section 5.2 error objects. Supports
    authorization_code, client_credentials, password and refresh_token; rejects
    implicit and jwt-bearer as unsupported_grant_type.
- id: rfc8414-oauth-authorization-server-metadata
  conforms: false
