    no id_token or OIDC scope surface found.'
- id: saml-2.0
  conforms: true
  evidence: >-
    Valid SAML 2.0 SPSSODescriptor served at
    https://api.aristamd.com/saml2/metadata (200, text/xml). Declares HTTP-POST
    ACS at /saml2/acs, HTTP-Redirect SLO at /saml2/sls, persistent NameID format.
  caveat: AuthnRequestsSigned="false" and WantAssertionsSigned="false" — signing
    is not required by this service provider.
- id: hl7-v2
  conforms: partial
  evidence: >-
    POST /HL7/messages — "Creates a Patient from an HL7 message". A single
    message-intake endpoint exists, but the request body is typed as the
    proprietary `Patient` definition rather than as an HL7 message, so the
    contract does not describe which HL7 message types, segments or versions are
    accepted. The provider's GitHub org publishes MLLP transport tooling
    (aristamd/mllparty, aristamd/elixir-mllp), which corroborates real HL7 v2
    usage outside the REST surface.
- id: fhir
  conforms: false
  evidence: >-
    No FHIR resource, no FHIR-shaped schema and no /fhir, /metadata or
    CapabilityStatement endpoint appears in the published contract or on the
    probed host. Third-party writeups and vendor marketing describe the platform
    as "based on the FHIR standard"; the public API does not evidence that. If a
    FHIR facade exists it is not publicly discoverable.
  x-discrepancy: true
