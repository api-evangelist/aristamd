gap: >-
  AristaMD's integration story is EHR-embedded and HL7-based rather than
  SDK-based, which is consistent with the healthcare market. But an integrator
  who finds the live Swagger document has no generated client to start from, and
  because the document's operationIds are not unique (14 distinct ids across 42
  operations), standard code generators will not produce a usable client from it
  either. Fixing operationId uniqueness would make an SDK generatable for free.
