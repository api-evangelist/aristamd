generated: '2026-08-06'
method: derived
status: candidate
source: openapi/aristamd-openapi-original.json
searched:
  official_server: none
  evidence: >-
    No MCP server is published by AristaMD. Searched the provider's site, its
    GitHub organization (38 public repos), and probed for a hosted endpoint. No
    /mcp surface, no llms.txt tool list, no registry entry. The company has no
    public developer program at all.
description: >-
  A CANDIDATE tool surface derived by API Evangelist from AristaMD's published
  Swagger 2.0 document. This is NOT an AristaMD product and no such server is
  running. It exists to show what an MCP server over this API would look like,
  and to make the agent-facing shape of the API reviewable.

  No `MCPServer` pointer is wired into apis.yml, because AristaMD does not
  operate one. Wiring it would credit the provider with an agent surface it does
  not have.

warnings:
- id: phi
  severity: critical
  detail: >-
    Every patient- and econsult-scoped tool below returns US protected health
    information. Any real MCP deployment over this API needs a BAA, per-tool
    authorization, PHI-safe logging and human review of writes. The tool list is
    the easy part; the governance is not.
- id: no-idempotency
  severity: high
  detail: >-
    The API has no idempotency key. Agent retries on create_econsult or
    create_patient can produce duplicate clinical records. Any server built here
    must implement idempotency itself.
- id: non-unique-operation-ids
  severity: high
  detail: >-
    The source document reuses operationIds (index x8, show x5, store x4,
    update x4). Tools below are therefore bound to METHOD + PATH, which is
    unambiguous, rather than to operationId, which is not.

server:
  name: aristamd
  transport: http
  url: null
  status: not-published

